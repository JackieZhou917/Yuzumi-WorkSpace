<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 200px;
      height: 100px;
      font-size: 30px;
      text-align: center;
      line-height: 100px;
    }
    .box:nth-child(1) {
      background-color: #ca4545;
    }
    .box:nth-child(2) {
      background-color: #45ca45;
    }
    .box:nth-child(3) {
      background-color: #4732bb;
    }
    .container{
      display: flex;
      /* flex-direction: column; */
      /* width: 800px; */
      border: 1px dotted #000;
      /* justify-content: space-around; */

    }
    .box {
      flex-grow: 1;
      /* flex-shrink: 1; */
    }
    .box:nth-child(2) {
      flex-grow: 0;
      flex-shrink: 0;
      flex-basis: 200px
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
</body>
</html>
