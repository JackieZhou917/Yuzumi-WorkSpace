        <p>
            JavaScript 代码通常从上到下依次执行，但程序中的任务并不总能立刻完成，
            可能会出现各种问题。这篇文章将会帮助你真正理解异步、回调与 Promise这些概念及使用。这是因为早期实现中，typeof 是通过将值转为二进制，来判断类型的，二进制前三位是 000 的统一被认为是引用类型。在计算机中，所有引用类型被转为二进制的前三位都是 0 (除了函数 function)，而 null 会被转为一整串 0，所以 typeof(null) 是 object。上述也是typeof通常只用来判断原始类型的主要原因。
