<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let a = 1
        console.log(a)
        new Promise((resolve) => {
            a = 2
            console.log(a)
            resolve()
        }).then(() => {
            a = 3
            console.log(a)
        })

        setTimeout(() => {
            a = 4
            console.log(a)
        }, 1000)
    </script>
    <h2>hello</h2>
</body>
</html>
